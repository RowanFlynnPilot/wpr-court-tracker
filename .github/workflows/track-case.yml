name: Track-a-case intake

# Two lanes, one policy gate (pipeline/issue_case.py):
#
#   1. INSTANT FEEDBACK - every "track-a-case" issue is validated the
#      moment it's opened or edited. Failures get a fix-it comment.
#   2. PUBLISHING - depends on who filed it:
#        - Newsroom (repo owner/members/collaborators): queued, then
#          published automatically by the twice-daily sweep below.
#          Closing the issue before the sweep cancels it.
#        - Anyone else: labelled needs-editor-review and answered with a
#          comment. Nothing is committed; an editor re-files it from the
#          desk if the newsroom takes the case on.
#          Auto-publish is NEVER extended to outside submissions - this
#          is a public repo and the issue form is open to the internet.
#
# Issue bodies are untrusted: passed via env/stdin, never
# shell-interpolated, validated before anything is staged.

on:
  issues:
    types: [opened, edited]
  schedule:
    # Publish sweeps aim at 7:45 a.m. and 3:45 p.m. Central. GitHub
    # delivers scheduled runs late and drops some (sweeps were landing 3-6
    # hours late in November 2026), and its cron is UTC-only - so each
    # sweep gets a ticket in BOTH UTC offsets and none is gated: the
    # sweep is idempotent (nothing queued = a no-op), so a spare or late
    # one is harmless and "next sweep" simply means the next one that
    # arrives. To publish NOW, run this workflow from the Actions tab.
    # GITHUB_TOKEN pushes never trigger on:push workflows, so the sweep
    # dispatches the deploy itself.
    - cron: '45 12,13 * * *'
    - cron: '45 20,21 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: write

jobs:
  feedback:
    if: >-
      github.event_name == 'issues' &&
      contains(github.event.issue.labels.*.name, 'track-a-case')
    concurrency:
      group: track-case-intake
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Build and validate the case entry
        id: parse
        continue-on-error: true
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: python pipeline/issue_case.py 2> err.txt

      - name: Explain a rejected form on the issue
        if: steps.parse.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NO: ${{ github.event.issue.number }}
        run: |
          {
            echo "This request can't go on the tracker yet:"
            echo
            echo '```'
            cat err.txt
            echo '```'
            echo
            echo "Edit this issue's description to fix it — it re-checks automatically."
          } > comment.md
          gh issue comment "$ISSUE_NO" --body-file comment.md
          exit 1

      - name: Queue a newsroom submission for the next publish sweep
        if: >-
          steps.parse.outcome == 'success' &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NO: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NO" --body "Passed the editorial policy check ✔ Queued as a newsroom submission — it publishes automatically at the next sweep (7:45 a.m. or 3:45 p.m. Central). Close this issue before then to cancel, or run the 'Track-a-case intake' workflow from the Actions tab to publish now."

      # Outside submissions are never published by automation and never
      # reach the repo: they get a label and a comment, and wait for an
      # editor. If the newsroom takes the case on, an editor files it from
      # the Case Entry Desk under their own name - and THAT filing is the
      # sign-off, exactly as for any newsroom submission.
      - name: Hold an outside submission for an editor
        if: >-
          steps.parse.outcome == 'success' &&
          !contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NO: ${{ github.event.issue.number }}
        run: |
          gh label create needs-editor-review --color 5319E7             --description "Outside case request waiting on an editor" 2>/dev/null || true
          gh issue edit "$ISSUE_NO" --add-label needs-editor-review
          {
            echo "Thanks. This request passed our editorial policy check."
            echo
            echo "Requests from outside the newsroom are never published automatically. An editor will review it, and if we take the case on we will add it to the tracker ourselves."
            echo
            echo "_Editors: to track this case, open the [Case Entry Desk](https://rowanflynnpilot.github.io/wpr-court-tracker/editor.html), paste the case link from this request, and submit it under your own name. Then close this issue._"
          } > comment.md
          gh issue comment "$ISSUE_NO" --body-file comment.md

  publish:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    concurrency:
      group: track-case-intake
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Publish queued newsroom cases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          git config user.name "wpr-court-tracker"
          git config user.email "actions@github.com"
          PUBLISHED=0
          FAILED=0
          for N in $(gh api "repos/$GITHUB_REPOSITORY/issues?labels=track-a-case&state=open&per_page=100" \
                       --jq '.[] | select(.pull_request == null) | .number'); do
            ASSOC=$(gh api "repos/$GITHUB_REPOSITORY/issues/$N" --jq .author_association)
            case "$ASSOC" in
              OWNER|MEMBER|COLLABORATOR) ;;
              *) echo "skip #$N ($ASSOC) - outside request, held for an editor"; continue ;;
            esac
            gh issue view "$N" --json body --jq .body > body.txt
            if python pipeline/issue_case.py < body.txt 2> err.txt; then
              CASE_NO=$(python -c "import json; print(json.load(open('out/new_case.json'))['caseNo'])")
              HEADLINE=$(python -c "import json; print(json.load(open('out/new_case.json'))['headline'])")
              CASE_ID=$(python -c "import json; print(json.load(open('out/new_case.json'))['id'])")
              MODE=$(python -c "import json; print(json.load(open('out/new_case.json')).get('intakeMode','new'))")
              [ "$MODE" = "update" ] && VERB="Update" || VERB="Track"
              git add config/cases.json
              git commit -m "$VERB $CASE_NO: $HEADLINE" -m "Published from track-a-case issue #$N (newsroom submission)."
              gh issue comment "$N" --body "Published — live with the next deploy (minutes): https://rowanflynnpilot.github.io/wpr-court-tracker/#$CASE_ID"
              gh issue close "$N"
              PUBLISHED=$((PUBLISHED+1))
            else
              FAILED=$((FAILED+1))
              {
                echo "The publish sweep couldn't add this case:"
                echo
                echo '```'
                cat err.txt
                echo '```'
                echo
                echo "Edit the issue description to fix it — the next sweep retries automatically."
              } > comment.md
              gh issue comment "$N" --body-file comment.md
            fi
          done
          if [ "$PUBLISHED" -gt 0 ]; then
            git pull --rebase origin main
            git push
            # The token push above can't trigger on:push - deploy explicitly
            # so "live in minutes" (the issue comment's promise) stays true.
            gh workflow run "Update court data and deploy"
          fi
          echo "published $PUBLISHED case(s), $FAILED needing fixes"

      # The machine can't write the follow-up, but it can notice a
      # promise went unkept: one auto-managed issue lists watched cases
      # whose hearing passed - or whose record moved - with no newsroom
      # note since. Runs after publishing so a just-swept update clears
      # its own nudge.
      - name: Nudge stale case-file follow-ups
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python pipeline/followups.py --markdown > followups.md
          N=$(gh issue list --label needs-newsroom-note --state open --json number --jq '.[0].number')
          if [ -s followups.md ]; then
            gh label create needs-newsroom-note --color C4A000 \
              --description "Case files owing readers a reporter's note" 2>/dev/null || true
            if [ -z "$N" ]; then
              gh issue create --label needs-newsroom-note \
                --title "Case files needing a reporter follow-up" \
                --body-file followups.md
            else
              gh issue edit "$N" --body-file followups.md
            fi
          elif [ -n "$N" ]; then
            gh issue close "$N" --comment "Every tracked hearing now has a newsroom note - nothing stale."
          fi
