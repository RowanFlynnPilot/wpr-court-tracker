name: Update court data and deploy

on:
  schedule:
    # GOAL: a check about every 2 hours, 8 a.m.-6 p.m. Central, weekdays.
    # Courts don't docket overnight; don't poll overnight.
    #
    # GitHub delivers scheduled runs late and DROPS many of them: with six
    # top-of-the-hour crons this repo got 5.3 runs a day in July 2026 and
    # 1.6 a day by November, often hours late. So the cron is now a
    # stream of cheap "tickets" - every 20 minutes, off the top of the
    # hour, across the Central business day in both UTC offsets - and the
    # `gate` job decides which ones become a real check: it must be a
    # Central weekday daytime, and the last check must be 105+ minutes
    # old. WCCA still sees at most ~6 checks a day; dropped tickets no
    # longer cost a check, and DST needs no cron edits.
    - cron: '7,27,47 13-23 * * 1-5'
    - cron: '7,27,47 0 * * 2-6'
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      attempt:
        description: 'WCCA fetch attempt (the workflow hands itself off to a fresh runner on failure; max 3)'
        required: false
        default: '1'

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write
  issues: write

jobs:
  # Pushes and dispatches always run. A scheduled ticket becomes a check
  # only on a Central weekday between 8 a.m. and 7 p.m. (late-delivered
  # tickets still count) and only if the last check - read from the
  # deployed heartbeat.json, written by the update job below - is at
  # least 105 minutes old.
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.clock.outputs.run }}
    steps:
      - id: clock
        env:
          EVENT: ${{ github.event_name }}
          SITE: https://rowanflynnpilot.github.io/wpr-court-tracker
        run: |
          RUN=true
          WHY="push or manual run"
          if [ "$EVENT" = "schedule" ]; then
            ZONE=$(TZ=America/Chicago date +%Z)
            DOW=$(TZ=America/Chicago date +%u)
            MIN=$(( 10#$(TZ=America/Chicago date +%H) * 60 + 10#$(TZ=America/Chicago date +%M) ))
            NOW=$(date +%s)
            LAST=$(curl -fsS --max-time 20 "$SITE/heartbeat.json?t=$NOW" 2>/dev/null \
              | python3 -c "import json,sys; print(int(json.load(sys.stdin)['attemptedAtEpoch']))" 2>/dev/null || echo 0)
            case "$ZONE" in
              CDT|CST) ;;
              *) echo "::warning::Could not resolve America/Chicago (got '$ZONE'); treating this ticket as in-hours."
                 DOW=1; MIN=600 ;;
            esac
            if [ "$DOW" -gt 5 ] || [ "$MIN" -lt 480 ] || [ "$MIN" -gt 1140 ]; then
              RUN=false; WHY="outside weekdays 8 a.m.-7 p.m. Central"
            elif [ "$LAST" -gt 0 ]; then
              AGE=$(( (NOW - LAST) / 60 ))
              WHY="last check was $AGE minutes ago"
              [ "$AGE" -ge 105 ] || RUN=false
            else
              # No readable heartbeat: never over-poll. Fall back to the
              # first ticket of each even Central hour (8, 10, ... 18).
              H=$(( MIN / 60 )); M=$(( MIN % 60 ))
              WHY="no heartbeat; even-hour fallback (hour $H, minute $M)"
              if [ $(( H % 2 )) -ne 0 ] || [ "$M" -ge 20 ]; then RUN=false; fi
            fi
          fi
          echo "$WHY -> run=$RUN"
          echo "run=$RUN" >> "$GITHUB_OUTPUT"

  update:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    # Job-level, so skipped tickets never queue behind (or cancel) a real
    # run waiting in this group.
    concurrency:
      group: court-tracker
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      # '1' for schedule/push; self-handoff dispatches 2 then 3.
      ATTEMPT: ${{ inputs.attempt || '1' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Run pipeline tests
        run: python tests/test_pipeline.py

      # A push that touches neither the watchlist nor the pipeline has no
      # reason to contact the court system: it deploys the data already
      # live. (One evening of development on 2026-11-16 was 17 pushes, each
      # firing a check - and, during a WCCA outage, three runner attempts
      # and an alert comment apiece.) Scheduled tickets, manual runs, the
      # publish sweep's dispatch and handoffs always check. If the diff
      # can't be computed, check: failing toward a check is the safe side.
      - name: Decide whether this run checks the court record
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          CHECK=true
          if [ "$EVENT" = "push" ]; then
            if git fetch -q --depth=1 origin "$BEFORE" 2>/dev/null                && git diff --quiet "$BEFORE" HEAD -- config pipeline; then
              CHECK=false
            fi
          fi
          echo "event=$EVENT -> check=$CHECK"
          echo "check=$CHECK" >> "$GITHUB_OUTPUT"

      # continue-on-error so a WCCA stall can't block deploying - the site
      # ships with the last committed (still-valid) data. WCCA slows for
      # datacenter IPs in predictable windows (~1 p.m. and ~7 p.m. Central,
      # observed daily); a fresh runner minutes later usually gets through,
      # so failures hand off to a new runner (new IP) up to 3 attempts,
      # and only a 3-runner miss raises the wcca-outage issue. Runs stay
      # green: red is reserved for real bugs (tests, build, deploy).
      - name: Fetch court activity (official WCCA RSS)
        id: fetch
        if: steps.plan.outputs.check == 'true'
        continue-on-error: true
        run: python pipeline/fetch.py

      - name: Hand off to a fresh runner (WCCA stalled on this one)
        if: steps.fetch.outcome == 'failure' && (env.ATTEMPT == '1' || env.ATTEMPT == '2')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NEXT=$((ATTEMPT + 1))
          echo "::warning::WCCA fetch stalled (runner attempt $ATTEMPT of 3). Dispatching attempt $NEXT on a fresh runner; this run still deploys last-good data."
          # A GitHub API blip here once reddened a run (2026-08-17). Retry
          # once, then warn: the next tick is the fallback, not a red run.
          gh workflow run "Update court data and deploy" -f attempt="$NEXT" \
            || { sleep 15; gh workflow run "Update court data and deploy" -f attempt="$NEXT"; } \
            || echo "::warning::Could not dispatch the fresh-runner handoff; the next scheduled tick will retry."

      # Issue bookkeeping must never redden a deploy (it did on 2026-08-17).
      - name: Raise the outage flag (three runners couldn't reach WCCA)
        continue-on-error: true
        if: steps.fetch.outcome == 'failure' && env.ATTEMPT == '3'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "::warning::WCCA unreachable after 3 fresh-runner attempts. Site serves last-good data; the widget's checked-at time stays honest."
          gh label create wcca-outage --color B60205 --description "WCCA unreachable from Actions runners" 2>/dev/null || true
          N=$(gh issue list --label wcca-outage --state open --json number --jq '.[0].number')
          if [ -z "$N" ]; then
            gh issue create --label wcca-outage \
              --title "WCCA unreachable from Actions runners" \
              --body "Court-record checks are timing out from GitHub's runners (three fresh runners tried per tick). The site keeps deploying with last-good data and the widget shows the honest checked-at time. This issue closes automatically on the first successful check. Playbook: CLAUDE.md operational notes."
          else
            gh issue comment "$N" --body "Still unreachable at $(date -u '+%F %T') UTC (3 fresh-runner attempts)."
          fi

      - name: Clear the outage flag
        continue-on-error: true
        if: steps.fetch.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          N=$(gh issue list --label wcca-outage --state open --json number --jq '.[0].number')
          if [ -n "$N" ]; then
            gh issue close "$N" --comment "Recovered - court-record checks are succeeding again."
          fi

      # heartbeat.json is deployed with the site and never committed. The
      # gate reads it to space checks ~2 hours apart; the methodology page
      # reads it for "successful checks, past 7 days". Every run carries
      # the live copy's history forward; only a run that actually checked
      # (success or stall) adds an entry and moves the last-check time.
      - name: Record the check heartbeat
        continue-on-error: true
        env:
          FETCH: ${{ steps.fetch.outcome }}
        run: |
          export PREV=$(curl -fsS --max-time 20 "https://rowanflynnpilot.github.io/wpr-court-tracker/heartbeat.json?t=$(date +%s)" 2>/dev/null || echo '{}')
          python3 - <<'PY'
          import json, os, time
          now = int(time.time())
          try:
              prev = json.loads(os.environ.get("PREV") or "{}")
          except ValueError:
              prev = {}
          checks = [c for c in prev.get("checks", [])
                    if isinstance(c, dict) and now - int(c.get("at", 0)) < 14 * 86400]
          outcome = os.environ.get("FETCH", "")
          last = int(prev.get("attemptedAtEpoch", 0) or 0)
          if outcome in ("success", "failure"):
              checks.append({"at": now, "ok": outcome == "success"})
              last = now
          with open("data/heartbeat.json", "w") as f:
              json.dump({"attemptedAtEpoch": last, "checks": checks}, f)
          print(f"heartbeat: fetch {outcome or 'n/a'}; {len(checks)} checks on record")
          PY

      # Commit only real record changes. Timestamp lines (generatedAt,
      # lastBuildDate) move every run; skipping them keeps "watch the repo"
      # a pure newsroom alert channel - every data commit names its cases.
      # changes.json is deliberately NOT part of the gate: it empties
      # itself one run after each alert, which made every real commit
      # echo a "refresh" commit. It still rides along (git add data/)
      # whenever the gate opens. The deployed site always ships the
      # fresh files from this workspace either way.
      # KEEPALIVE: GitHub disables scheduled workflows in a public repo
      # after 60 days without repository activity. Quiet cases plus
      # signal-only commits left this repo with no commit from Oct 1 to
      # Nov 16, 2026 - two weeks from the tracker silently stopping. So a
      # refresh IS committed once the last commit is 25+ days old.
      - name: Commit data changes
        run: |
          STALE_DAYS=$(( ( $(date +%s) - $(git log -1 --format=%ct) ) / 86400 ))
          if ! git diff --quiet -I '"generatedAt":' -I '<lastBuildDate>' -- data/feed.json data/tracker.xml data/hearings.ics || [ "$STALE_DAYS" -ge 25 ]; then
            git config user.name "wpr-court-tracker"
            git config user.email "actions@github.com"
            git add data/
            if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
            SUMMARY=$(python -c "import json; c=json.load(open('data/changes.json'))['changed']; print('Court data: ' + (', '.join(x['caseNo'] for x in c) if c else 'refresh'))")
            git commit -m "$SUMMARY"
            git push
          fi

      # Quiet checks never commit, so the committed feed's "checked" time
      # is usually older than the live one. A run that skipped the check
      # must not roll the site's checked-at backwards: it takes the data
      # files from the live site when those are newer, all or nothing.
      - name: Carry the live data forward (runs that didn't check)
        if: steps.fetch.outcome == 'skipped'
        continue-on-error: true
        run: |
          SITE=https://rowanflynnpilot.github.io/wpr-court-tracker
          mkdir -p live
          for f in feed.json changes.json stats.json tracker.xml hearings.ics; do
            curl -fsS --max-time 20 "$SITE/$f?t=$(date +%s)" -o "live/$f" || { echo "could not fetch $f; keeping the committed data"; exit 0; }
          done
          NEWER=$(python3 -c "import json; a=json.load(open('live/feed.json'))['generatedAt']; b=json.load(open('data/feed.json'))['generatedAt']; print('yes' if a > b else 'no')")
          if [ "$NEWER" = "yes" ]; then cp live/* data/; echo "carried the live data forward"; else echo "committed data is current"; fi
          rm -rf live

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: widget/package-lock.json

      - name: Build widget
        working-directory: widget
        run: |
          npm ci
          node scripts/test-parse.mjs
          npm run build

      # Same pattern as wpr-brewers-tracker: email clients strip iframes
      # and social networks want a fixed og:image, so pre-render both
      # cards to PNGs served from the Pages root. Not committed -
      # rebuilt fresh on every deploy.
      - name: Render newsletter digest + social card images
        working-directory: widget
        run: |
          npx playwright install --with-deps chromium
          npm run preview -- --port 4173 --host 127.0.0.1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:4173/mini-digest.html > /dev/null && break
            sleep 1
          done
          node scripts/render-cards.mjs http://127.0.0.1:4173 dist

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: widget/dist

      - id: deployment
        uses: actions/deploy-pages@v5
